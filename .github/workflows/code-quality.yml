name: Code Quality

on:
  push:
    branches: [ gh-patches, main ]
  pull_request:
    branches: [ gh-patches, main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    # Runs the unit suite on every supported interpreter, plus the live TLS
    # check. The TLS shim in _tls_compat.py only matters on interpreters linked
    # against OpenSSL >= 3.5; actions/setup-python builds link the runner's
    # system OpenSSL (3.0.x), so uv-managed interpreters are used here because
    # they bundle their own. The live test self-skips where it cannot apply.
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.10"

    - name: Install uv
      run: pip install uv

    - name: Install interpreter ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Report interpreter and OpenSSL
      run: |
        uv run --python ${{ matrix.python-version }} python -c \
          "import ssl, sys; print(sys.version.split()[0], '|', ssl.OPENSSL_VERSION)"

    - name: Unit tests
      run: uv run --python ${{ matrix.python-version }} --extra dev pytest -q

    - name: Live TLS handshake check
      run: |
        uv run --python ${{ matrix.python-version }} --extra dev \
          pytest -m live tests/live/test_tls_compat_live.py -v -rs

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.10"

    # Install uv
    - name: Install uv
      run: pip install uv

    - name: Setup venv
      run: |
        python -m venv .venv

    - name: Install dependencies
      run: |
        uv pip install --python .venv/bin/python -e ".[dev]"

    - name: Check code quality
      id: quality
      continue-on-error: true
      run: |
        echo "::group::Running make ci"
        ci_output=$(uv run make ci 2>&1) || ci_failed=true
        echo "$ci_output"
        echo "::endgroup::"

        echo "# Code Quality Report" > report.md
        echo "" >> report.md

        if [ "$ci_failed" = true ]; then
          echo "### ❌ quality gate (make ci) failed" >> report.md
          echo "\`\`\`" >> report.md
          echo "$ci_output" >> report.md
          echo "\`\`\`" >> report.md
          echo "ci_failed=true" >> $GITHUB_OUTPUT
        else
          echo "### ✅ make ci passed" >> report.md
          echo "ci_failed=false" >> $GITHUB_OUTPUT
        fi

    - name: Post results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('report.md', 'utf8');
          
          // Posting comments doesn't work if the PR is from another repository (fork) due to permissions.
          // This is crude solution but should work.
          try {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
          } 
          catch (error) {
            console.error("Error posting comment:", error);
          }

    - name: Check results
      if: steps.quality.outputs.ci_failed == 'true'
      run: exit 1
